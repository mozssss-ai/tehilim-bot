name: learn best posting time

on:
  schedule:
    - cron: "0 7 * * 0"   # כל יום ראשון בבוקר
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python tune.py
      - run: |
          git config user.name "tehilim-bot"
          git config user.email "tehilim-bot@users.noreply.github.com"
          git add learn.json
          git commit -m "learned best posting times" || exit 0
          git pull --rebase -q && git push
