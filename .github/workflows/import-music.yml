name: import music

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python import_music.py
      - name: save
        run: |
          git config user.name "tehilim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/music music_styles.py
          git commit -q -m "Real public-domain recordings replace synthesized music"
          git pull --rebase -q && git push -q
