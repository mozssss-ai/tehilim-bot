name: post daily chapter

on:
  schedule:
    # כל חצי שעה בין 08:00 ל-23:30 שעון ישראל (בערך). הבוט מחליט לבד אם להעלות.
    - cron: "5,35 6-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: check if a post is due
        id: check
        env:
          IG_TOKEN_SET: ${{ secrets.IG_TOKEN != '' }}
        run: python bot.py --check
      - name: install ffmpeg
        if: steps.check.outputs.post == 'true'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: build and publish reel
        if: steps.check.outputs.post == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python bot.py
      - name: save state
        if: steps.check.outputs.post == 'true'
        run: |
          git config user.name "tehilim-bot"
          git config user.email "tehilim-bot@users.noreply.github.com"
          git add state.json
          git commit -m "posted chapter" || exit 0
          git pull --rebase -q && git push
