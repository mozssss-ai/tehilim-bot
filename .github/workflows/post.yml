name: post daily chapter

on:
  schedule:
    # כל חצי שעה, מסביב לשעון. הבוט מחליט לבד אם להעלות (ולא מעלה בשבת ובחג).
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/run-post"]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: check if a post is due
        id: check
        env:
          IG_TOKEN_SET: ${{ secrets.IG_TOKEN != '' }}
        run: python bot.py --check
      - name: install ffmpeg
        if: steps.check.outputs.post == 'true'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: wait for the exact posting time
        if: steps.check.outputs.post == 'true' && steps.check.outputs.wait != '0'
        run: sleep ${{ steps.check.outputs.wait }}
      - name: build and publish reel (+ story)
        if: steps.check.outputs.post == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python bot.py
      - name: answer "תהילים" comments
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python comments.py
      - name: marketing analysis + phone dashboard
        if: always()
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export RECENT_RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow post.yml --created ">$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" --json conclusion --limit 100 2>/dev/null || echo "[]")
          python gallery.py
          python marketing.py
      - name: watchdog (alert if a chapter is late)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python watchdog.py
      - name: update status page
        if: always()
        run: python bot.py --status
      - name: save state
        if: always()
        run: |
          git config user.name "tehilim-bot"
          git config user.email "tehilim-bot@users.noreply.github.com"
          git add state.json STATUS.md replied.json marketing.json dedications.json overrides.json whatsapp.json docs 2>/dev/null || git add state.json STATUS.md
          git commit -m "bot update" || exit 0
          git pull --rebase -q && git push
